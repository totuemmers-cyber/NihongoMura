    // Japanese particle → German effect
    const DE_PARTICLE_EFFECT = {
        '_p_wa': null,          // topic marker, no German effect
        '_p_ga': null,          // subject marker
        '_p_wo': null,          // object marker
        '_p_ni': null,          // dative/location
        '_p_de': null,          // instrument/location
        '_p_no': null,          // genitive/possessive
        '_p_mo': null,          // also
        '_p_to': null,          // and/with
        '_p_ka': 'question',    // → question mark
        '_p_yo': 'exclaim',     // → !
        '_p_ne': 'exclaim',     // → !
        '_p_desu': null,        // copula
    };

    function conjugateGermanVerb(infinitive, pronoun) {
        const key = pronoun || 'er';
        // Try exact match
        const conj = DE_VERB_CONJ[infinitive];
        if (conj && conj[key]) return conj[key];
        // Regular conjugation fallback
        let stem = infinitive;
        if (stem.endsWith('en')) stem = stem.slice(0, -2);
        else if (stem.endsWith('n')) stem = stem.slice(0, -1);
        switch (key) {
            case 'ich': return stem + 'e';
            case 'du': return stem + (stem.endsWith('t') || stem.endsWith('d') ? 'est' : 'st');
            case 'er': return stem + (stem.endsWith('t') || stem.endsWith('d') ? 'et' : 't');
            case 'wir': case 'sie': return infinitive;
            default: return stem + 't';
        }
    }

    function buildGermanResponse(words, learner) {
        const fromFrame = germanFor(words, learner);
        if (fromFrame) return fromFrame;
        if (!words || words.length === 0) return { text: '...', anyKnown: false };

        // --- Pre-pass: extract location noun (noun before で particle) ---
        let locationWord = null;
        const filtered = [];
        for (let i = 0; i < words.length; i++) {
            if (words[i].conceptId === '_p_de' && filtered.length > 0) {
                const prev = filtered[filtered.length - 1];
                if (prev.type === 'noun') {
                    locationWord = filtered.pop();
                    continue;
                }
            }
            filtered.push(words[i]);
        }

        // --- Classify words ---
        let subject = null, verb = null, objects = [], modifiers = [];
        let effects = new Set();
        let anyKnown = false, hasUnknown = false;

        for (const w of filtered) {
            if (w.type === 'particle') {
                const eff = DE_PARTICLE_EFFECT[w.conceptId];
                if (eff) effects.add(eff);
                continue;
            }
            // Synthesized grammar words (とても, counters) — always include
            if (w.conceptId && w.conceptId.startsWith('_')) {
                if (w.type === 'mod' && w.de) modifiers.push(w);
                continue;
            }
            const known = learner.knownWords.has(w.conceptId);
            if (!known) { hasUnknown = true; continue; }
            anyKnown = true;

            if (w.type === 'pronoun' && !subject) subject = w;
            else if (w.type === 'verb' && !verb) verb = w;
            else if (w.type === 'noun') {
                if (!subject) subject = w;
                else objects.push(w);
            }
            else if (w.type === 'mod') modifiers.push(w);
        }

        if (!anyKnown) return { text: '...', anyKnown: false };

        // --- Detect tense/negation from conjugated verb romaji ---
        if (verb && verb.romaji) {
            const r = verb.romaji;
            if (r.endsWith('masendeshita')) effects.add('neg_past');
            else if (r.endsWith('mashita')) effects.add('past');
            else if (r.endsWith('masen')) effects.add('neg');
            else if (r.endsWith('nai')) effects.add('neg');
            else if (r.endsWith('ta') && !r.endsWith('masu')) effects.add('past');
        }

        // --- Helpers ---
        function nounWithArticle(noun, kasus) {
            const art = DE_NOUN_ARTICLE[noun.conceptId];
            if (art) return (kasus === 'akk' ? art[1] : art[0]) + ' ' + noun.de;
            return noun.de;
        }

        function locPhrase() {
            if (!locationWord) return null;
            if (learner.knownWords.has(locationWord.conceptId)) {
                return DE_LOCATION[locationWord.conceptId] || ('bei ' + locationWord.de);
            }
            return null;
        }

        // Join modifiers: "sehr" attaches to next adjective, rest joined with "und"
        function modPhrase(mods) {
            if (mods.length === 0) return null;
            const parts = [];
            for (let i = 0; i < mods.length; i++) {
                if (mods[i].de === 'sehr' && i + 1 < mods.length) {
                    parts.push('sehr ' + mods[i + 1].de);
                    i++;
                } else {
                    parts.push(mods[i].de);
                }
            }
            if (parts.length === 1) return parts[0];
            return parts.slice(0, -1).join(', ') + ' und ' + parts[parts.length - 1];
        }

        function pastParticiple(verbDe) {
            if (DE_PP_MAP[verbDe]) return DE_PP_MAP[verbDe];
            let stem = verbDe;
            if (stem.endsWith('en')) stem = stem.slice(0, -2);
            else if (stem.endsWith('n')) stem = stem.slice(0, -1);
            const insep = ['be', 'emp', 'ent', 'er', 'ge', 'miss', 'ver', 'zer'];
            if (insep.some(p => verbDe.startsWith(p) && verbDe.length > p.length + 2)) {
                return stem + 't';
            }
            return 'ge' + stem + 't';
        }

        // --- Build sentence ---
        const tokens = [];
        const conjKey = subject ? (DE_PRONOUN_CONJ[subject.conceptId] || 'er') : 'er';
        const isQuestion = effects.has('question');

        // Subject phrase
        const subj = subject
            ? (subject.type === 'pronoun'
                ? (DE_PRONOUN_SUBJ[subject.conceptId] || subject.de)
                : nounWithArticle(subject, 'nom'))
            : null;

        if (verb) {
            // === Verb-based sentence ===
            if (effects.has('past') || effects.has('neg_past')) {
                // Perfekt: "Ich habe den Tee getrunken" / "Hat er den Tee getrunken?"
                const auxVerb = SEIN_VERBS.has(verb.de) ? 'sein' : 'haben';
                const aux = conjugateGermanVerb(auxVerb, conjKey);
                if (isQuestion) {
                    tokens.push(aux.charAt(0).toUpperCase() + aux.slice(1));
                    if (subj) tokens.push(subj.toLowerCase());
                } else {
                    if (subj) tokens.push(subj);
                    tokens.push(aux);
                }
                if (effects.has('neg_past')) tokens.push('nicht');
                const loc = locPhrase();
                if (loc) tokens.push(loc);
                for (const o of objects) tokens.push(nounWithArticle(o, 'akk'));
                const mp = modPhrase(modifiers);
                if (mp) tokens.push(mp);
                tokens.push(pastParticiple(verb.de));
            } else {
                // Present: "Ich esse den Tee" / "Esse ich den Tee?"
                const vf = conjugateGermanVerb(verb.de, conjKey);
                if (isQuestion) {
                    tokens.push(vf.charAt(0).toUpperCase() + vf.slice(1));
                    if (subj) tokens.push(subj.toLowerCase());
                } else {
                    if (subj) tokens.push(subj);
                    tokens.push(vf);
                }
                if (effects.has('prog')) tokens.push('gerade');
                const loc = locPhrase();
                if (loc) tokens.push(loc);
                for (const o of objects) tokens.push(nounWithArticle(o, 'akk'));
                const mp = modPhrase(modifiers);
                if (mp) tokens.push(mp);
                if (effects.has('neg')) tokens.push('nicht');
            }
        } else {
            // === Copula sentence: "Das Essen ist heiß und gut" ===
            const cop = conjugateGermanVerb('sein', conjKey);
            if (isQuestion) {
                tokens.push(cop.charAt(0).toUpperCase() + cop.slice(1));
                if (subj) tokens.push(subj.toLowerCase());
            } else {
                if (subj) tokens.push(subj);
                tokens.push(cop);
            }
            const loc = locPhrase();
            if (loc) tokens.push(loc);
            // Secondary nouns in copula context — use nominative
            for (const o of objects) tokens.push(nounWithArticle(o, 'nom'));
            const mp = modPhrase(modifiers);
            if (mp) tokens.push(mp);
        }

        // Unknown word placeholder (single ... instead of per-word)
        if (hasUnknown && tokens.length > 0) tokens.push('...');

        let text = tokens.join(' ');
        if (!text.trim() || text.trim() === '...') return { text: '...', anyKnown: false };

        // Capitalize first letter
        text = text.charAt(0).toUpperCase() + text.slice(1);

        // Punctuation
        if (isQuestion) text += '?';
        else text += '.';

        return { text, anyKnown };
    }

    function learnerRespond(sentence, action) {
        const learner = persons[1];
        const speaker = persons[0];

        // Try to learn each word (in hearing range = can also observe)
        for (const w of sentence.words) {
            if (!learner.knownWords.has(w.conceptId)) {
                if (Math.random() < learner.learnChance) {
                    learnWord(learner, w);
                }
            }
        }

        // Build response — German translation with grammar
        setTimeout(() => {
            const result = buildGermanResponse(sentence.words, learner);
            const anyKnown = result.anyKnown;
            const responseText = result.text;

            const bubble = new SpeechBubble(learner, responseText, [], true);
            speechBubbles.push(bubble);
            if (responseText !== '...') {
                sfx('respond');
                addLog(`${learner.name}: "${responseText}"`, 'speak');
            }
        }, 600 / Math.max(1, gameSpeed));
    }

    // ============================================================
    //  NIGHTTIME STORYTELLING
    // ============================================================
    function canStartStorytelling() {
        if (storytelling.active) return false;
        if (storytelling.cooldownDay >= gameDay) return false;
        if (gameHour < 20 && gameHour >= 4) return false;
        const speaker = persons[0];
        if (speaker.state !== 'idle') return false;
        if (speaker.actionHistory.length < 3) return false;
        const fire = cachedTeahouse;
        if (!fire) return false;
        if (speaker.distTo(fire.x, fire.y) > 80) return false;
        return true;
    }

    function startStorytelling() {
        const speaker = persons[0];
        storytelling.active = true;
        storytelling.currentIdx = 0;
        storytelling.timer = 0;
        storytelling.cooldownDay = gameDay;

        // Build story from 3-5 recent actions
        const storyLen = Math.min(speaker.actionHistory.length, randInt(3, 5));
        const storyActions = speaker.actionHistory.slice(0, storyLen);
        storytelling.sentences = [];

        for (const actionId of storyActions) {
            const actionDef = ACTION_DEFS.find(a => a.id === actionId);
            if (actionDef && actionDef.templates && actionDef.templates.length > 0) {
                // Told by the fire: past tense ("I drank tea…")
                const tellable = actionDef.templates.filter(t => !frameFor(actionDef.id, t).fixed);   // fixed phrases don't shift to past
                const sent = sayTemplate(actionDef.id, randEl(tellable.length ? tellable : actionDef.templates), { polite: true, narrative: true });
                const { kanjiText, kanaText, words } = sent;
                storytelling.sentences.push({ text: kanjiText, kanjiText, kanaText, words });
            }
        }

        if (storytelling.sentences.length === 0) {
            storytelling.active = false;
            return;
        }

        addLog(`${speaker.name} beginnt eine Geschichte am Feuer...`, 'speak');

        // Make nearby NPCs face the teahouse
        const fire = cachedTeahouse;
        if (fire) {
            for (const npc of npcs) {
                if (npc.distTo(fire.x, fire.y) < 100) {
                    npc.facing = Math.atan2(fire.y - npc.y, fire.x - npc.x);
                    if (npc.state === 'idle') {
                        npc.state = 'moving';
                        setTargetWithPath(npc, Math.max(40, Math.min(WORLD_W - 40, fire.x + randFloat(-30, 30))), Math.max(40, Math.min(WORLD_H - 40, fire.y + randFloat(-30, 30))));
                    }
                }
            }
        }
    }

    function updateStorytelling(dt) {
        if (!storytelling.active) return;

        storytelling.timer -= dt;
        if (storytelling.timer > 0) return;

        const speaker = persons[0];

        if (storytelling.currentIdx < storytelling.sentences.length) {
            const sentence = storytelling.sentences[storytelling.currentIdx];
            const stBubble = new SpeechBubble(speaker, sentence.kanjiText || sentence.text, sentence.words, false);
            stBubble.kanjiText = sentence.kanjiText || sentence.text;
            stBubble.kanaText = sentence.kanaText || '';
            speechBubbles.push(stBubble);
            sfx('speak');
            addLog(`${speaker.name}: "${sentence.kanjiText || sentence.text}"`, 'speak');

            // Learner tries to learn from story
            const learner = persons[1];
            if (learner.distTo(speaker.x, speaker.y) <= learner.hearingRange) {
                for (const w of sentence.words) {
                    if (!learner.knownWords.has(w.conceptId) && vocab[w.conceptId]) {
                        if (Math.random() < learner.learnChance) {
                            learnWord(learner, w);
                        }
                    }
                }
            }

            storytelling.currentIdx++;
            storytelling.timer = randFloat(100, 180);
        } else {
            // Story ended — learner retells
            storytelling.active = false;
            learnerRetellStory();
        }
    }

    function learnerRetellStory() {
        const learner = persons[1];
        const speaker = persons[0];
        if (learner.distTo(speaker.x, speaker.y) > learner.hearingRange) return;

        // Pick 2-3 random sentences from the story and retell using known words
        const retellCount = Math.min(storytelling.sentences.length, randInt(1, 2));
        const retellIdxs = [];
        while (retellIdxs.length < retellCount && retellIdxs.length < storytelling.sentences.length) {
            const idx = randInt(0, storytelling.sentences.length - 1);
            if (!retellIdxs.includes(idx)) retellIdxs.push(idx);
        }

        setTimeout(() => {
            for (const idx of retellIdxs) {
                const sentence = storytelling.sentences[idx];
                const rr = buildGermanResponse(sentence.words, learner);
                const responseText = rr.text;
                if (responseText.replace(/\.\.\./g, '').trim().length > 0) {
                    speechBubbles.push(new SpeechBubble(learner, responseText, [], true));
                    sfx('respond');
                    addLog(`${learner.name}: "${responseText}" (Nacherzählung)`, 'speak');
                }
            }
            // Boost relationship from shared storytelling
            boostRelationshipsNearby(speaker, 5);
        }, 800 / Math.max(1, gameSpeed));
    }

    // ============================================================
    //  DISCOVERY EVENTS
    // ============================================================
    const DISCOVERY_TYPES = [
        { type: 'ancient_scroll', speech: [['find','book','old'],['look','book','old']],              desc: 'eine alte Schriftrolle' },
        { type: 'lucky_charm',    speech: [['find','thing','beautiful'],['this','good','old']],       desc: 'einen Glücksbringer' },
        { type: 'old_coins',      speech: [['find','money','old'],['money','many','here']],           desc: 'alte Münzen' },
        { type: 'hanko_seal',     speech: [['find','thing','red'],['this','old','good']],             desc: 'ein Hanko-Siegel' },
        { type: 'pottery_shards', speech: [['find','thing','old'],['look','this','here']],            desc: 'Keramikscherben' },
        { type: 'ikebana',        speech: [['flower','beautiful','many'],['look','flower','good']],   desc: 'ein Ikebana-Arrangement' },
    ];

    function spawnDiscovery() {
        const available = DISCOVERY_TYPES.filter(d => !discoveredTypes.has(d.type));
        if (available.length === 0) return;
        const disc = randEl(available);
        const x = randFloat(60, WORLD_W - 60);
        const y = randFloat(60, WORLD_H - 60);
        discoveries.push({ ...disc, x, y, found: false });
        addLog('Etwas Ungewöhnliches ist aufgetaucht...', 'speak');
    }

    function updateDiscoveries(dt) {
        // Spawn timer (every 3-8 game days worth of ticks)
        discoveryTimer -= dt;
        if (discoveryTimer <= 0) {
            discoveryTimer = randFloat(8000, 22000); // roughly 3-8 game days
            spawnDiscovery();
        }

        // Speaker notices nearby undiscovered objects
        if (persons.length === 0) return;
        const speaker = persons[0];
        if (speaker.state !== 'idle' || storytelling.active) return;

        for (const disc of discoveries) {
            if (disc.found) continue;
            const d = speaker.distTo(disc.x, disc.y);
            const noticeRange = 40 + speaker.neugier * 6;
            if (d < noticeRange) {
                investigateDiscovery(disc);
                break;
            }
            // High curiosity speakers move toward discoveries
            if (d < noticeRange * 2 && speaker.neugier >= 6 && Math.random() < 0.001 * dt) {
                speaker.state = 'moving';
                speaker.currentAction = { id: 'investigate', duration: 200, templates: [['look','this','here']], effects: {}, activityDe: 'Untersucht etwas...', priority: 'idle' };
                speaker.targetX = disc.x + randFloat(-10, 10);
                speaker.targetY = disc.y + randFloat(-10, 10);
                speaker.activityDe = 'Untersucht etwas...';
                break;
            }
        }
    }

    function investigateDiscovery(disc) {
        disc.found = true;
        discoveredTypes.add(disc.type);
        const speaker = persons[0];

        // Speak about discovery
        const sent = pickLine(disc.speech, 'discover_' + disc.type, { polite: true });
        if (sent) speakerRemark(sent, t => `${speaker.name} entdeckt ${disc.desc}: "${t}"`, 1.3);

        // Remove after a short delay
        setTimeout(() => {
            discoveries = discoveries.filter(d => d !== disc);
        }, 3000 / Math.max(1, gameSpeed));
    }

    function drawDiscoveries(ctx) {
        for (const disc of discoveries) drawDiscovery(ctx, disc);
    }
    function drawDiscovery(ctx, disc) {
        {
            if (disc.found) return;
            const x = disc.x * canvasScale;
            const y = disc.y * canvasScale;
            const s = canvasScale;
            const t = gameTick * 0.03;

            // Subtle golden glow
            ctx.save();
            ctx.globalAlpha = 0.3 + Math.sin(t) * 0.15;
            ctx.beginPath();
            ctx.arc(x, y, 12*s, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(212,160,48,0.15)';
            ctx.fill();
            ctx.globalAlpha = 1;

            switch (disc.type) {
                case 'ancient_scroll':
                    // Rolled scroll
                    ctx.fillStyle = '#d8c898';
                    ctx.fillRect(x - 8*s, y - 2*s, 16*s, 4*s);
                    // Roll ends
                    ctx.fillStyle = '#c8b080';
                    ctx.beginPath();
                    ctx.ellipse(x - 8*s, y, 1.5*s, 2.5*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(x + 8*s, y, 1.5*s, 2.5*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    // Red seal stamp
                    ctx.fillStyle = '#cc3030';
                    ctx.fillRect(x + 2*s, y - 1*s, 3*s, 2*s);
                    // Faint ink characters
                    ctx.fillStyle = 'rgba(30,30,30,0.3)';
                    ctx.fillRect(x - 5*s, y - 0.5*s, 1*s, 1*s);
                    ctx.fillRect(x - 2*s, y - 0.5*s, 1*s, 1*s);
                    break;
                case 'lucky_charm':
                    // Omamori lucky charm (fabric pouch)
                    ctx.fillStyle = '#5aaa5a';
                    ctx.globalAlpha = 0.85 + Math.sin(t * 2) * 0.15;
                    ctx.beginPath();
                    ctx.moveTo(x, y - 6*s);
                    ctx.lineTo(x + 5*s, y - 2*s);
                    ctx.lineTo(x + 4*s, y + 4*s);
                    ctx.lineTo(x - 4*s, y + 4*s);
                    ctx.lineTo(x - 5*s, y - 2*s);
                    ctx.closePath();
                    ctx.fill();
                    // Shine highlight
                    ctx.fillStyle = 'rgba(180,240,180,0.4)';
                    ctx.beginPath();
                    ctx.ellipse(x - 1*s, y - 1*s, 2*s, 1.5*s, -0.3, 0, Math.PI*2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    break;
                case 'old_coins':
                    // Japanese coins
                    ctx.fillStyle = '#b0a060';
                    for (let i = 0; i < 4; i++) {
                        const cx = x + (i - 1.5) * 4*s;
                        const cy = y + Math.sin(i * 1.5) * 2*s;
                        ctx.beginPath();
                        ctx.arc(cx, cy, 3*s, 0, Math.PI*2);
                        ctx.fill();
                        // Square hole
                        ctx.fillStyle = '#6a5a30';
                        ctx.fillRect(cx - 1*s, cy - 1*s, 2*s, 2*s);
                        ctx.fillStyle = '#b0a060';
                    }
                    break;
                case 'hanko_seal':
                    // Hanko seal (Japanese name stamp)
                    ctx.fillStyle = '#8a6a4a';
                    ctx.fillRect(x - 3*s, y - 5*s, 6*s, 10*s);
                    // Carved top
                    ctx.fillStyle = '#9a7a5a';
                    ctx.beginPath();
                    ctx.arc(x, y - 5*s, 3*s, Math.PI, 0);
                    ctx.fill();
                    // Red ink on bottom
                    ctx.fillStyle = '#cc3030';
                    ctx.fillRect(x - 2.5*s, y + 3*s, 5*s, 2*s);
                    break;
                case 'pottery_shards':
                    // Broken pottery pieces
                    ctx.fillStyle = '#b08050';
                    ctx.beginPath();
                    ctx.moveTo(x - 4*s, y - 3*s);
                    ctx.lineTo(x + 2*s, y - 4*s);
                    ctx.lineTo(x + 4*s, y + 1*s);
                    ctx.lineTo(x - 1*s, y + 3*s);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#a07040';
                    ctx.beginPath();
                    ctx.moveTo(x + 3*s, y - 1*s);
                    ctx.lineTo(x + 7*s, y - 2*s);
                    ctx.lineTo(x + 6*s, y + 3*s);
                    ctx.lineTo(x + 2*s, y + 2*s);
                    ctx.closePath();
                    ctx.fill();
                    // Blue glaze fragments
                    ctx.strokeStyle = '#4060a0';
                    ctx.lineWidth = 0.5*s;
                    ctx.beginPath();
                    ctx.arc(x, y - 1*s, 2*s, 0.5, 2.5);
                    ctx.stroke();
                    break;
                case 'ikebana':
                    // Ikebana flower arrangement
                    ctx.fillStyle = '#c0a060';
                    ctx.beginPath();
                    ctx.ellipse(x, y + 3*s, 3*s, 4*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillRect(x - 2*s, y - 1*s, 4*s, 2*s);
                    // Stems
                    ctx.strokeStyle = '#3a7a2a';
                    ctx.lineWidth = 0.8*s;
                    ctx.beginPath();
                    ctx.moveTo(x - 1*s, y - 1*s); ctx.lineTo(x - 3*s, y - 8*s);
                    ctx.moveTo(x, y - 1*s); ctx.lineTo(x + 1*s, y - 10*s);
                    ctx.moveTo(x + 1*s, y - 1*s); ctx.lineTo(x + 4*s, y - 7*s);
                    ctx.stroke();
                    // Flower heads
                    const discFlowerColors = ['#e06080', '#e0a040', '#d060d0'];
                    for (let i = 0; i < 3; i++) {
                        const fx = [x - 3*s, x + 1*s, x + 4*s][i];
                        const fy = [y - 8*s, y - 10*s, y - 7*s][i];
                        ctx.fillStyle = discFlowerColors[i];
                        ctx.beginPath();
                        ctx.arc(fx, fy, 2*s, 0, Math.PI*2);
                        ctx.fill();
                        ctx.fillStyle = '#e0d030';
                        ctx.beginPath();
                        ctx.arc(fx, fy, 0.8*s, 0, Math.PI*2);
                        ctx.fill();
                    }
                    break;
            }
            ctx.restore();
        }
    }

    // ============================================================
    //  AI - MAIN LOOP
    // ============================================================
    function updateSpeakerAI(dt) {
        const p = persons[0];

        switch (p.state) {
            case 'idle':
                p.idleTimer -= dt;
                p.activityDe = 'Untätig';
                // Check storytelling trigger
                if (!storytelling.active && p.idleTimer <= 0 && canStartStorytelling()) {
                    startStorytelling();
                    p.idleTimer = 200; // wait during storytelling
                    p.activityDe = 'Erzählt eine Geschichte';
                    break;
                }
                if (storytelling.active) {
                    p.activityDe = 'Erzählt eine Geschichte';
                    break;
                }
                if (p.idleTimer <= 0) {
                    // Choose next action
                    const action = chooseSpeakerAction();
                    p.currentAction = action;
                    p.state = 'moving';
                    p.activityDe = 'Geht zu ' + (action.activityDe || '...');

                    // Find target
                    let tx, ty;
                    if (action.target) {
                        const obj = findClosestObject(action.target);
                        if (obj) {
                            const spot = standSpot(obj);
                            tx = spot.x;
                            ty = spot.y;
                        } else {
                            tx = p.x; ty = p.y;
                        }
                    } else if (action.requiresOther) {
                        tx = persons[1].x + randFloat(-20, 20);
                        ty = persons[1].y + randFloat(-20, 20);
                    } else {
                        tx = p.x + randFloat(-60, 60);
                        ty = p.y + randFloat(-40, 40);
                    }
                    // Clamp to world
                    tx = Math.max(30, Math.min(WORLD_W - 30, tx));
                    ty = Math.max(30, Math.min(WORLD_H - 30, ty));
                    setTargetWithPath(p, tx, ty);
                }
                break;

            case 'moving':
                if (p.moveToward(p.targetX, p.targetY, dt)) {
                    if (!p.currentAction) {
                        // Safety: if action was lost, return to idle
                        p.state = 'idle';
                        p.idleTimer = 60;
                        break;
                    }
                    p.state = 'acting';
                    p.actionTimer = p.currentAction.duration / (0.5 + p.geschick * 0.08) + 240; // +4s pause after speaking
                    p.activityDe = p.currentAction.activityDe;
                    sfxForAction(p.currentAction.id);
                    speakerSpeak(p.currentAction);
                    // Trigger contextual object label glow
                    if (p.currentAction.target) {
                        const glowObj = worldObjects.find(o => o.type === p.currentAction.target &&
                            Math.sqrt((o.x - p.x) ** 2 + (o.y - p.y) ** 2) < 80);
                        if (glowObj) activeObjectGlow = { objId: glowObj.id, timer: 180, maxTimer: 180 };
                    }
                }
                break;

            case 'acting':
                p.actionTimer -= dt;
                if (p.actionTimer <= 0) {
                    // Apply effects
                    if (p.currentAction.effects) {
                        if (p.currentAction.effects.hunger) p.hunger = Math.min(100, p.hunger + p.currentAction.effects.hunger);
                        if (p.currentAction.effects.thirst) p.thirst = Math.min(100, p.thirst + p.currentAction.effects.thirst);
                        if (p.currentAction.effects.energy) p.energy = Math.min(100, p.energy + p.currentAction.effects.energy);
                    }
                    // Track camp progress
                    if (p.currentAction.id) {
                        campProgress[p.currentAction.id] = (campProgress[p.currentAction.id] || 0) + 1;
                        checkCampMilestones();
                        // Boost relationships with nearby characters
                        boostRelationshipsNearby(p, 3);
                    }
                    p.state = 'idle';
                    p.idleTimer = randInt(40, 140) / (0.5 + p.geschick * 0.05);
                    p.currentAction = null;
                }
                break;
        }
    }

    function updateLearnerAI(dt) {
        const learner = persons[1];
        const speaker = persons[0];
        const distToSpeaker = learner.distTo(speaker.x, speaker.y);

        // --- Freeze (stunned from wrong quiz answer) ---
        if (learnerFreezeTimer > 0) {
            learnerFreezeTimer -= dt;
            learner.activityDe = 'Verwirrt...';
            return; // Skip all AI while frozen
        }

        // --- Critical needs override only when idle ---
        if (learner.state === 'idle') {
            let needAction = null;
            if (learner.hunger < 25) {
                const food = findClosestObjectFrom(learner, 'kitchen') || findClosestObjectFrom(learner, 'market');
                if (food) {
                    needAction = { target: food, action: { id: 'eat_self', duration: 120, effects: { hunger: 38 }, activityDe: 'isst' }, label: 'Geht essen' };
                }
            } else if (learner.thirst < 25) {
                const water = findClosestObjectFrom(learner, 'well') || findClosestObjectFrom(learner, 'teahouse');
                if (water) {
                    needAction = { target: water, action: { id: 'drink_self', duration: 80, effects: { thirst: 53 }, activityDe: 'trinkt' }, label: 'Geht trinken' };
                }
            } else if (learner.energy < 15) {
                const house = findClosestObjectFrom(learner, 'house');
                if (house) {
                    needAction = { target: house, action: { id: 'sleep_self', duration: 300, effects: { energy: 45 }, activityDe: 'schläft' }, label: 'Geht schlafen' };
                }
            }

            if (needAction) {
                learner.state = 'moving';
                const spot = standSpot(needAction.target, 0.7);
                setTargetWithPath(learner, spot.x, spot.y);
                learner.currentAction = needAction.action;
                learner.activityDe = needAction.label;
                learner.followMode = 'returning'; // will return to speaker after
                return;
            }
        }

        // --- Follow mode management (only when idle) ---
        if (learner.state === 'idle') {
            switch (learner.followMode) {
                case 'following':
                    learner.followTimer -= dt;
                    // Curiosity drives wander probability: curious learners explore more
                    if (learner.followTimer <= 0) {
                        if (Math.random() < learner.wanderChance) {
                            learner.followMode = 'wandering';
                            // Curious learners wander further and longer
                            const wanderRange = 80 + learner.neugier * 8;
                            learner.wanderTimer = randInt(100 + learner.neugier * 15, 300 + learner.neugier * 20);
                            let wtx = Math.max(40, Math.min(WORLD_W - 40, learner.x + randFloat(-wanderRange, wanderRange)));
                            let wty = Math.max(40, Math.min(WORLD_H - 40, learner.y + randFloat(-wanderRange * 0.8, wanderRange * 0.8)));
                            setTargetWithPath(learner, wtx, wty);
                            learner.activityDe = 'Schaut sich um';
                        }
                        // Sociable learners re-check sooner (shorter follow timer)
                        learner.followTimer = randInt(600, 1200) / (0.5 + learner.geselligkeit * 0.08);
                    }
                    break;

                case 'wandering':
                    learner.wanderTimer -= dt;
                    // Sociable learners return sooner; hearing range determines awareness of distance
                    const maxWanderDist = learner.hearingRange * (2.0 - learner.geselligkeit * 0.08);
                    if (learner.wanderTimer <= 0 || distToSpeaker > maxWanderDist) {
                        learner.followMode = 'returning';
                        learner.activityDe = 'Kehrt zurück zu ' + speaker.name;
                    }
                    break;

                case 'returning':
                    // Sociable learners come back closer
                    if (distToSpeaker < learner.hearingRange * 0.5) {
                        learner.followMode = 'following';
                        learner.followTimer = randInt(600, 1200) / (0.5 + learner.geselligkeit * 0.08);
                    }
                    break;
            }
        }

        // --- Movement and actions ---
        switch (learner.state) {
            case 'idle': {
                if (learner.followMode === 'following' || learner.followMode === 'returning') {
                    learner.activityDe = learner.followMode === 'returning'
                        ? 'Kehrt zurück zu ' + speaker.name
                        : 'Folgt ' + speaker.name;

                    if (distToSpeaker > learner.hearingRange * 0.6) {
                        // Move toward speaker — recalculate only when speaker moved far
                        const angle = Math.atan2(speaker.y - learner.y, speaker.x - learner.x);
                        const followDist = 40;
                        let ftx = Math.max(30, Math.min(WORLD_W - 30, speaker.x - Math.cos(angle) * followDist));
                        let fty = Math.max(30, Math.min(WORLD_H - 30, speaker.y - Math.sin(angle) * followDist));
                        const targetChanged = Math.abs(ftx - learner.targetX) > 50 || Math.abs(fty - learner.targetY) > 50;
                        if (targetChanged || learner.waypoints.length === 0) {
                            setTargetWithPath(learner, ftx, fty);
                        }
                        learner.moveToward(learner.targetX, learner.targetY, dt);
                        learner.facing = angle;
                    } else if (distToSpeaker > 20) {
                        // Near speaker: face them and stand calmly (no jittering)
                        learner.facing = Math.atan2(speaker.y - learner.y, speaker.x - learner.x);
                        learner.activityDe = 'Hört zu';
                    }
                    // Within 20px: fully idle, do nothing
                } else if (learner.followMode === 'wandering') {
                    learner.activityDe = 'Schaut sich um';
                    // Move to wander target; pick new one only when reached
                    if (learner.distTo(learner.targetX, learner.targetY) < 12) {
                        let wtx2 = Math.max(40, Math.min(WORLD_W - 40, learner.x + randFloat(-60, 60)));
                        let wty2 = Math.max(40, Math.min(WORLD_H - 40, learner.y + randFloat(-40, 40)));
                        setTargetWithPath(learner, wtx2, wty2);
                    }
                    learner.moveToward(learner.targetX, learner.targetY, dt);
                }
                break;
            }

            case 'moving':
                if (learner.moveToward(learner.targetX, learner.targetY, dt)) {
                    if (learner.currentAction && learner.currentAction._isCommand) {
                        // Player-issued command: use dedicated handler
                        handleLearnerCommandArrival(learner);
                    } else if (learner.currentAction) {
                        learner.state = 'acting';
                        learner.actionTimer = learner.currentAction.duration / (0.5 + learner.geschick * 0.08);
                        learner.activityDe = learner.currentAction.activityDe;
                        sfxForAction(learner.currentAction.id);
                    } else {
                        learner.state = 'idle';
                    }
                }
                break;

            case 'acting':
                learner.actionTimer -= dt;
                if (learner.actionTimer <= 0) {
                    if (learner.currentAction && learner.currentAction.effects) {
                        if (learner.currentAction.effects.hunger) learner.hunger = Math.min(100, learner.hunger + learner.currentAction.effects.hunger);
                        if (learner.currentAction.effects.thirst) learner.thirst = Math.min(100, learner.thirst + learner.currentAction.effects.thirst);
                        if (learner.currentAction.effects.energy) learner.energy = Math.min(100, learner.energy + learner.currentAction.effects.energy);
                    }
                    learner.state = 'idle';
                    learner.currentAction = null;
                    // After need action, return to speaker
                    learner.followMode = 'returning';
                }
                break;
        }
    }

    function findClosestObjectFrom(person, type) {
        let best = null, bestDist = Infinity;
        for (const obj of worldObjects) {
            if (obj.type === type) {
                const d = person.distTo(obj.x, obj.y);
                if (d < bestDist) { bestDist = d; best = obj; }
            }
        }
        return best;
    }

    let _vocabPanelFp = '';
    function renderVocabPanel() {
        const learner = persons[1];
        const total = Object.keys(vocab).length;
        const known = learner.knownWords.size;
        const searchEl0 = document.getElementById('vocab-search');
        const fp = known + '|' + learner.wordHistory.length + '|' + vocabHistory.length + '|' + total + '|' + (searchEl0 ? searchEl0.value : '');
        if (fp === _vocabPanelFp) return;          // nothing it shows has changed
        _vocabPanelFp = fp;
        const pct = total > 0 ? Math.round(known / total * 100) : 0;

        document.getElementById('vocab-progress').innerHTML = `<span><b>${known}</b> / ${total} Wörter gelernt</span><span>${pct}%</span>`;
        document.getElementById('vocab-bar').style.width = pct + '%';

        // Sparkline — words learned per game-day
        let sparkCanvas = document.getElementById('vocab-sparkline');
        if (!sparkCanvas) {
            sparkCanvas = document.createElement('canvas');
            sparkCanvas.id = 'vocab-sparkline';
            sparkCanvas.width = 600;
            sparkCanvas.height = 64;
            sparkCanvas.style.cssText = 'width:100%;height:32px;margin:8px 0 0;display:block;';
            sparkCanvas.setAttribute('aria-hidden', 'true');
            const barBg = document.querySelector('#vocab-panel .progress-bar-bg');
            if (barBg) barBg.parentNode.insertBefore(sparkCanvas, barBg.nextSibling);
        }
        if (vocabHistory.length > 1) {
            const sCtx = sparkCanvas.getContext('2d');
            const sw = sparkCanvas.width, sh = sparkCanvas.height;
            sCtx.clearRect(0, 0, sw, sh);
            // Aggregate by game day
            const dayCounts = {};
            for (const h of vocabHistory) dayCounts[h.day] = (dayCounts[h.day] || 0) + 1;
            const days = Object.keys(dayCounts).map(Number).sort((a, b) => a - b);
            if (days.length >= 2) {
                const maxC = Math.max(...days.map(d => dayCounts[d]), 1);
                const pad = 6;
                sCtx.strokeStyle = '#86ab6f';
                sCtx.lineWidth = 3;
                sCtx.lineJoin = 'round';
                sCtx.beginPath();
                for (let i = 0; i < days.length; i++) {
                    const px = pad + (i / (days.length - 1)) * (sw - pad * 2);
                    const py = sh - pad - ((dayCounts[days[i]] / maxC) * (sh - pad * 2));
                    if (i === 0) sCtx.moveTo(px, py); else sCtx.lineTo(px, py);
                }
                sCtx.stroke();
                // Fill under curve
                sCtx.lineTo(pad + (sw - pad * 2), sh - pad);
                sCtx.lineTo(pad, sh - pad);
                sCtx.closePath();
                sCtx.fillStyle = 'rgba(134,171,111,0.16)';
                sCtx.fill();
            }
        }

        const listEl = document.getElementById('vocab-list');
        const searchEl = document.getElementById('vocab-search');
        const query = (searchEl ? searchEl.value : '').toLowerCase().trim();
        let html = '';
        for (const cid of learner.wordHistory) {
            const v = vocab[cid];
            if (!v) continue;
            if (query) {
                const matchKana = v.kana.includes(query) || (v.romaji || '').toLowerCase().includes(query);
                const matchDe = v.de.toLowerCase().includes(query);

            html += `<div class="vocab-word" data-cid="${cid}" title="Klicken für Kalligraphie"><span class="vw-kanji">${v.kanji}</span><span class="vw-reading">${v.kana}</span><span class="vw-meaning">${v.de}</span></div>`;
        }
        if (known === 0) {

        } else if (query && !html) {
            html = '<div class="empty">Keine Treffer</div>';
        }
        listEl.innerHTML = html;
    }

    // ============================================================
    //  SEASONAL WILDLIFE & MIGRATION
    // ============================================================
    let wildlife = [];
    let lastWildlifeSeason = null;

    const ANIMAL_TYPES = [
        { type: 'crane',     seasons: ['spring','summer','autumn'], speed: 0.5, fleeRange: 90, zonePref: 'river', flockSize: 1 },
        { type: 'magpie',    seasons: ['spring','summer'],          speed: 1.2, fleeRange: 70, zonePref: 'sky',   flockSize: 3 },
        { type: 'rabbit',    seasons: ['spring','summer','autumn','winter'], speed: 1.0, fleeRange: 60, zonePref: 'land', flockSize: 1 },
        { type: 'koi',       seasons: ['spring','summer','autumn'], speed: 0.3, fleeRange: 20, zonePref: 'water', flockSize: 2 },
        { type: 'cat',       seasons: ['spring','summer','autumn','winter'], speed: 0.6, fleeRange: 50, zonePref: 'land', flockSize: 1 },
        { type: 'butterfly', seasons: ['spring','summer'],          speed: 0.8, fleeRange: 60, zonePref: 'sky',   flockSize: 2 },
        { type: 'tanuki',    seasons: ['spring','summer','autumn'], speed: 0.7, fleeRange: 80, zonePref: 'land', flockSize: 1 },
    ];

    // Water zone near the pond south of village
    const WATER_ZONE = { x: 420, y: 560, r: 40 };

    // Land animals must avoid the river
    const LAND_ANIMAL_TYPES = new Set(['rabbit', 'cat', 'tanuki']);

    function clampLandAnimal(x, y) {
        // Push out of river zone (RIVER_LEFT..RIVER_RIGHT), except near bridge (wide tolerance)
        if (x > RIVER_LEFT && x < RIVER_RIGHT) {
            if (y > BRIDGE.y - BRIDGE.halfH - 35 && y < BRIDGE.y + BRIDGE.halfH + 35) return { x, y }; // bridge corridor OK
            // Push to nearest bank
            x = (x - RIVER_LEFT < RIVER_RIGHT - x) ? RIVER_LEFT - 5 : RIVER_RIGHT + 5;
        }
        return { x, y };
    }

    class WildAnimal {
        constructor(type, x, y, speed, fleeRange) {
            this.type = type;
            this.x = x;
            this.y = y;
            this.speed = speed;
            this.fleeRange = fleeRange;
            this.targetX = x;
            this.targetY = y;
            this.wanderTimer = randFloat(60, 200);
            this.fleeing = false;
            this.animPhase = randFloat(0, Math.PI * 2);
            this.facing = randFloat(0, Math.PI * 2);
            this.alive = true;
            // Reaction state
            this.reactAngle = this.facing;
            this.reactTimer = 0;
            this.approaching = false;
        }

        update(dt) {
            this.animPhase += dt * 0.05;

            // Check flee from all characters
            let closestDist = Infinity;
            let fleeFromX = 0, fleeFromY = 0;
            const allChars = [...persons, ...npcs];
            for (const c of allChars) {
                const d = Math.sqrt((this.x - c.x) ** 2 + (this.y - c.y) ** 2);
                if (d < closestDist) {
                    closestDist = d;
                    fleeFromX = c.x;
                    fleeFromY = c.y;
                }
            }

            if (closestDist < this.fleeRange) {
                this.fleeing = true;
                const angle = Math.atan2(this.y - fleeFromY, this.x - fleeFromX);
                this.targetX = this.x + Math.cos(angle) * 80;
                this.targetY = this.y + Math.sin(angle) * 80;
                if (this.type === 'koi') {
                    this.targetX = Math.max(WATER_ZONE.x - WATER_ZONE.r, Math.min(WATER_ZONE.x + WATER_ZONE.r, this.targetX));
                    this.targetY = Math.max(WATER_ZONE.y - WATER_ZONE.r * 0.6, Math.min(WATER_ZONE.y + WATER_ZONE.r * 0.6, this.targetY));
                }
                this.targetX = Math.max(10, Math.min(WORLD_W - 10, this.targetX));
                this.targetY = Math.max(10, Math.min(WORLD_H - 10, this.targetY));
                // Land animals: don't flee into the river
                if (LAND_ANIMAL_TYPES.has(this.type)) {
                    const c = clampLandAnimal(this.targetX, this.targetY);
                    this.targetX = c.x; this.targetY = c.y;
                }
            } else {
                this.fleeing = false;
                this.wanderTimer -= dt;
                if (this.wanderTimer <= 0) {
                    this.wanderTimer = randFloat(80, 250);
                    if (this.type === 'koi') {
                        // Stay in pond
                        this.targetX = WATER_ZONE.x + randFloat(-WATER_ZONE.r, WATER_ZONE.r);
                        this.targetY = WATER_ZONE.y + randFloat(-WATER_ZONE.r * 0.6, WATER_ZONE.r * 0.6);
                    } else if (this.type === 'crane') {
                        // Stay near river
                        this.targetX = randFloat(690, 790);
                        this.targetY = Math.max(60, Math.min(580, this.y + randFloat(-80, 80)));
                    } else {
                        this.targetX = Math.max(20, Math.min(WORLD_W - 20, this.x + randFloat(-100, 100)));
                        this.targetY = Math.max(20, Math.min(WORLD_H - 20, this.y + randFloat(-60, 60)));
                        // Land animals: avoid the river
                        if (LAND_ANIMAL_TYPES.has(this.type)) {
                            const c = clampLandAnimal(this.targetX, this.targetY);
                            this.targetX = c.x; this.targetY = c.y;
                        }
                    }
                }
            }

            // Ambient reactions (non-fleeing)
            if (!this.fleeing) {
                const speaker = persons[0], learner = persons[1];
                const dSpeaker = Math.sqrt((this.x - speaker.x) ** 2 + (this.y - speaker.y) ** 2);
                const dLearner = Math.sqrt((this.x - learner.x) ** 2 + (this.y - learner.y) ** 2);

                if (this.type === 'crane' && dSpeaker < 120 && speechBubbles.length > 0) {
                    // Crane turns head toward speaker
                    const targetAngle = Math.atan2(speaker.y - this.y, speaker.x - this.x);
                    this.reactAngle += (targetAngle - this.reactAngle) * 0.03 * dt;
                    this.reactTimer = 60;
                } else if (this.type === 'cat' && dLearner < 80 && learner.state !== 'moving') {
                    // Cat approaches idle learner
                    if (!this.approaching && Math.random() < 0.002 * dt) this.approaching = true;
                    if (this.approaching && dLearner > 20) {
                        this.targetX = learner.x + randFloat(-15, 15);
                        this.targetY = learner.y + randFloat(-15, 15);
                    }
                    if (learner.state === 'moving') this.approaching = false;
                } else if (this.type === 'magpie' && dSpeaker < 100 && speechBubbles.length > 0) {
                    // Magpie flaps faster when speaker talks
                    this.animPhase += dt * 0.08; // extra flap speed
                }

                // Decay reaction
                if (this.reactTimer > 0) {
                    this.reactTimer -= dt;
                } else {
                    this.reactAngle += (this.facing - this.reactAngle) * 0.02 * dt;
                    this.approaching = false;
                }
            }

            // Move toward target
            const dx = this.targetX - this.x;
            const dy = this.targetY - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 2) {
                const spd = this.speed * (this.fleeing ? 2.0 : 0.6) * dt * 0.4;
                const step = Math.min(spd, dist);
                this.x += (dx / dist) * step;
                this.y += (dy / dist) * step;
                this.facing = Math.atan2(dy, dx);
            }
            // Koi: hard clamp position to pond every frame
            if (this.type === 'koi') {
                this.x = Math.max(WATER_ZONE.x - WATER_ZONE.r, Math.min(WATER_ZONE.x + WATER_ZONE.r, this.x));
                this.y = Math.max(WATER_ZONE.y - WATER_ZONE.r * 0.6, Math.min(WATER_ZONE.y + WATER_ZONE.r * 0.6, this.y));
            }
            // Land animals: hard clamp out of river every frame
            if (LAND_ANIMAL_TYPES.has(this.type)) {
                const c = clampLandAnimal(this.x, this.y);
                this.x = c.x; this.y = c.y;
            }

            // Despawn if off screen
            if (this.x < -30 || this.x > WORLD_W + 30 || this.y < -30 || this.y > WORLD_H + 30) {
                this.alive = false;
            }
        }
    }

    function spawnWildlife() {
        const season = getSeason();
        wildlife = [];
        for (const def of ANIMAL_TYPES) {
            if (!def.seasons.includes(season)) continue;
            let count = def.flockSize + (season === 'spring' ? 1 : 0);
            if (def.type === 'koi') count = Math.min(count, 2); // pond is small
            for (let i = 0; i < count; i++) {
                let x, y;
                if (def.zonePref === 'water') {
                    x = WATER_ZONE.x + randFloat(-WATER_ZONE.r, WATER_ZONE.r);
                    y = WATER_ZONE.y + randFloat(-WATER_ZONE.r * 0.5, WATER_ZONE.r * 0.5);
                } else if (def.zonePref === 'river') {
                    // Along the drawn river (x ~710-790)
                    x = randFloat(710, 780);
                    y = randFloat(100, 550);
                } else if (def.zonePref === 'sky') {
                    x = randFloat(50, WORLD_W - 50);
                    y = randFloat(30, WORLD_H * 0.4);
                } else {
                    x = randFloat(50, WORLD_W - 50);
                    y = randFloat(50, WORLD_H - 50);
                }
                wildlife.push(new WildAnimal(def.type, x, y, def.speed, def.fleeRange));
            }
        }
        lastWildlifeSeason = season;
    }

    function updateWildlife(dt) {
        // Check for season change
        const season = getSeason();
        if (season !== lastWildlifeSeason) {
            spawnWildlife();
        }

        for (const a of wildlife) a.update(dt);
        wildlife = wildlife.filter(a => a.alive);

        // Speaker occasionally notices nearby animal
        if (persons.length > 0 && Math.random() < 0.0004 * dt) {
            const speaker = persons[0];
            if (speaker.state === 'idle') {
                for (const a of wildlife) {
                    const d = speaker.distTo(a.x, a.y);
                    const noticeRange = 60 + speaker.neugier * 8;
                    if (d < noticeRange) {
                        speakerReactToAnimal(a.type);
                        break;
                    }
                }
            }
        }
    }

    function speakerReactToAnimal(animalType) {
        const sent = pickLine(ANIMAL_LINES[animalType] || [['look','this']], 'animal_' + animalType, { polite: true });
        if (sent) speakerRemark(sent, t => `${persons[0].name}: "${t}" (${animalType})`);
    }

    function drawWildlife(ctx) {
        for (const a of wildlife) drawWildAnimal(ctx, a);
    }
    function drawWildAnimal(ctx, a) {
        {
            const x = a.x * canvasScale;
            const y = a.y * canvasScale;
            const s = canvasScale;
            const t = a.animPhase;

            ctx.save();
            ctx.translate(x, y);

            switch (a.type) {
                case 'crane': {
                    // Long legs
                    ctx.strokeStyle = '#2a2a2a';
                    ctx.lineWidth = 1.2*s;
                    const legBob = Math.sin(t * 2) * 2 * s;
                    ctx.beginPath();
                    ctx.moveTo(-3*s, 4*s); ctx.lineTo(-3*s, 14*s + legBob);
                    ctx.moveTo(3*s, 4*s); ctx.lineTo(3*s, 14*s - legBob);
                    ctx.stroke();
                    // White body
                    ctx.fillStyle = '#f0ece0';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 8*s, 5*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    // Long neck — uses reactAngle for head turning
                    const neckAngle = a.reactTimer > 0 ? a.reactAngle : a.facing;
                    ctx.strokeStyle = '#f0ece0';
                    ctx.lineWidth = 3*s;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(a.facing) * 6*s, -2*s);
                    ctx.quadraticCurveTo(Math.cos(neckAngle) * 10*s, -10*s, Math.cos(neckAngle) * 8*s, -16*s);
                    ctx.stroke();
                    // Head
                    const hx = Math.cos(neckAngle) * 8*s;
                    ctx.beginPath();
                    ctx.arc(hx, -16*s, 3*s, 0, Math.PI*2);
                    ctx.fillStyle = '#f0ece0';
                    ctx.fill();
                    // Red crown
                    ctx.beginPath();
                    ctx.arc(hx, -18*s, 1.5*s, 0, Math.PI*2);
                    ctx.fillStyle = '#cc3030';
                    ctx.fill();
                    // Beak
                    ctx.fillStyle = '#6a6a40';
                    ctx.beginPath();
                    ctx.moveTo(hx + Math.cos(a.facing) * 3*s, -16*s);
                    ctx.lineTo(hx + Math.cos(a.facing) * 7*s, -15.5*s);
                    ctx.lineTo(hx + Math.cos(a.facing) * 3*s, -15*s);
                    ctx.closePath();
                    ctx.fill();
                    // Eye
                    ctx.fillStyle = '#111';
                    ctx.beginPath();
                    ctx.arc(hx + Math.cos(a.facing) * 1.5*s, -16.5*s, 0.7*s, 0, Math.PI*2);
                    ctx.fill();
                    // Black tail feathers
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath();
                    ctx.moveTo(-6*s, -1*s);
                    ctx.lineTo(-12*s, -4*s);
                    ctx.lineTo(-10*s, 2*s);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'magpie': {
                    // Body (black and white)
                    ctx.fillStyle = '#1a1a2a';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 4*s, 2.5*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    // White belly
                    ctx.fillStyle = '#f0f0f0';
                    ctx.beginPath();
                    ctx.ellipse(0, 1*s, 2.5*s, 1.5*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    // Wings flapping
                    ctx.fillStyle = '#2a2a3a';
                    const wingUp = Math.sin(t * 6) * 4;
                    ctx.beginPath();
                    ctx.moveTo(-1*s, -1*s);
                    ctx.lineTo(-7*s, (-3 - wingUp)*s);
                    ctx.lineTo(-5*s, 1*s);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();

                    ctx.fill();
                    // Head
                    ctx.fillStyle = '#1a1a2a';
                    ctx.beginPath();

                    // Eye

                case 'rabbit': {

                    ctx.beginPath();

                    ctx.ellipse(Math.cos(a.facing) * 3*s - 1.5*s, -7*s, 0.6*s, 2*s, -0.2, 0, Math.PI*2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(Math.cos(a.facing) * 3*s + 1.5*s, -7*s, 0.6*s, 2*s, 0.2, 0, Math.PI*2);
                    ctx.fill();
                    // Tail
                    ctx.fillStyle = '#e0d8c0';
                    ctx.beginPath();
                    ctx.arc(-4*s, 0, 2*s, 0, Math.PI*2);
                    ctx.fill();
                    // Eye
                    ctx.fillStyle = '#3a1a1a';

                    ctx.arc(Math.cos(a.facing) * 5.5*s, -2.5*s, 0.8*s, 0, Math.PI*2);

                case 'koi': {
                    // Golden koi fish
                    ctx.fillStyle = '#e8a030';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 6*s, 3*s, a.facing, 0, Math.PI*2);

                    // White patches
                    ctx.fillStyle = '#f0e8d0';

                    ctx.fill();
                    // Tail fin
                    ctx.fillStyle = '#d08020';
                    const tailWag = Math.sin(t * 4) * 0.3;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(a.facing + Math.PI) * 5*s, Math.sin(a.facing + Math.PI) * 5*s);
                    ctx.lineTo(Math.cos(a.facing + Math.PI + 0.5 + tailWag) * 9*s, Math.sin(a.facing + Math.PI + 0.5 + tailWag) * 9*s);
                    ctx.lineTo(Math.cos(a.facing + Math.PI - 0.5 + tailWag) * 9*s, Math.sin(a.facing + Math.PI - 0.5 + tailWag) * 9*s);
                    ctx.closePath();
                    ctx.fill();
                    // Eye
                    ctx.fillStyle = '#111';
                    ctx.beginPath();
                    ctx.arc(Math.cos(a.facing) * 3*s, Math.sin(a.facing) * 3*s - 0.5*s, 0.8*s, 0, Math.PI*2);

                    // Water ripple
                    ctx.strokeStyle = 'rgba(100,160,210,0.25)';
                    ctx.lineWidth = s * 0.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, (7 + Math.sin(t * 2) * 2)*s, 0, Math.PI*2);
                    ctx.stroke();
                    break;
                }
                case 'cat': {
                    // Body
                    ctx.fillStyle = '#8a7050';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 5*s, 3*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    // Head
                    const catHx = Math.cos(a.facing) * 4*s;

                    ctx.arc(catHx, -2*s, 3*s, 0, Math.PI*2);
                    ctx.fillStyle = '#8a7050';
                    ctx.fill();
                    // Ears (triangles)
                    ctx.fillStyle = '#7a6040';
                    ctx.beginPath();
                    ctx.moveTo(catHx - 2.5*s, -4*s);
                    ctx.lineTo(catHx - 1*s, -7*s);
                    ctx.lineTo(catHx + 0.5*s, -4*s);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(catHx + 0.5*s, -4*s);
                    ctx.lineTo(catHx + 2*s, -7*s);
                    ctx.lineTo(catHx + 3.5*s, -4*s);
                    ctx.closePath();
                    ctx.fill();
                    // Eyes
                    ctx.fillStyle = '#aac030';
                    ctx.beginPath();
                    ctx.ellipse(catHx - 1*s, -2.5*s, 1*s, 0.8*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(catHx + 2*s, -2.5*s, 1*s, 0.8*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    // Pupils
                    ctx.fillStyle = '#111';
                    ctx.beginPath();
                    ctx.ellipse(catHx - 1*s, -2.5*s, 0.4*s, 0.7*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(catHx + 2*s, -2.5*s, 0.4*s, 0.7*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    // Tail (curved — raised when approaching learner)
                    ctx.strokeStyle = '#8a7050';
                    ctx.lineWidth = 1.5*s;
                    ctx.beginPath();
                    ctx.moveTo(-4*s, 0);
                    if (a.approaching) {
                        // Tail up, friendly posture
                        ctx.quadraticCurveTo(-6*s, -10*s, -3*s, -12*s);

                        ctx.quadraticCurveTo(-8*s, -6*s, -5*s + Math.sin(t * 2)*2*s, -8*s);
                    }
                    ctx.stroke();
                    break;
                }
                case 'butterfly': {
                    // Wings (colorful, flapping)
                    const wingFlap = Math.sin(t * 8) * 0.5;
                    const colors = ['#e06060', '#e08040', '#d0a030', '#e06080'];
                    const ci = Math.abs(Math.floor(a.x + a.y)) % colors.length;
                    ctx.fillStyle = colors[ci];
                    ctx.globalAlpha = 0.8;
                    // Left wing
                    ctx.beginPath();
                    ctx.ellipse(-2*s, -1*s, 3*s, (2 + wingFlap)*s, -0.4, 0, Math.PI*2);
                    ctx.fill();
                    // Right wing
                    ctx.beginPath();
                    ctx.ellipse(2*s, -1*s, 3*s, (2 + wingFlap)*s, 0.4, 0, Math.PI*2);
                    ctx.fill();
                    // Wing dots
                    ctx.fillStyle = '#fff';
                    ctx.globalAlpha = 0.5;
                    ctx.beginPath();
                    ctx.arc(-2*s, -1*s, 1*s, 0, Math.PI*2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(2*s, -1*s, 1*s, 0, Math.PI*2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    // Body
                    ctx.fillStyle = '#2a2a2a';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 0.8*s, 2.5*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    // Antennae
                    ctx.strokeStyle = '#2a2a2a';
                    ctx.lineWidth = 0.4*s;
                    ctx.beginPath();
                    ctx.moveTo(0, -2*s);
                    ctx.lineTo(-2*s, -4*s);
                    ctx.moveTo(0, -2*s);
                    ctx.lineTo(2*s, -4*s);
                    ctx.stroke();
                    break;
                }
                case 'tanuki': {
                    // Tanuki (raccoon dog) — round body, dark mask, bushy tail
                    // Body
                    ctx.fillStyle = '#7a6040';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 6*s, 4*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    // Head
                    const tnkHx = Math.cos(a.facing) * 4*s;
                    ctx.beginPath();
                    ctx.arc(tnkHx, -3*s, 3.5*s, 0, Math.PI*2);
                    ctx.fillStyle = '#7a6040';
                    ctx.fill();
                    // Face mask (dark patches around eyes)
                    ctx.fillStyle = '#3a2a18';
                    ctx.beginPath();
                    ctx.ellipse(tnkHx - 1.5*s, -3.5*s, 1.5*s, 1.2*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(tnkHx + 1.5*s, -3.5*s, 1.5*s, 1.2*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    // Eyes
                    ctx.fillStyle = '#111';
                    ctx.beginPath();
                    ctx.arc(tnkHx - 1.5*s, -3.5*s, 0.7*s, 0, Math.PI*2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(tnkHx + 1.5*s, -3.5*s, 0.7*s, 0, Math.PI*2);
                    ctx.fill();
                    // Nose
                    ctx.fillStyle = '#2a1a0a';
                    ctx.beginPath();
                    ctx.arc(tnkHx, -2*s, 0.8*s, 0, Math.PI*2);
                    ctx.fill();
                    // Belly (lighter)
                    ctx.fillStyle = '#b09a70';
                    ctx.beginPath();
                    ctx.ellipse(0, 1*s, 4*s, 2.5*s, 0, 0, Math.PI*2);
                    ctx.fill();
                    // Bushy tail
                    ctx.fillStyle = '#5a4a30';
                    ctx.beginPath();
                    ctx.moveTo(-5*s, 0);
                    ctx.quadraticCurveTo(-9*s, -4*s + Math.sin(t * 1.5)*2*s, -6*s, -8*s);
                    ctx.quadraticCurveTo(-4*s, -6*s, -4*s, -1*s);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
            }
            ctx.restore();
        }
    }

    // NPC chatter — contextual phrases based on location, weather, time, relationship
    function npcContextualChatter(npc, partner) {
        if (Object.keys(vocab).length === 0) return '...';
        // Villagers talk among themselves in plain speech (だ / る-form, ね / よ), about where they are,
        // the weather, the time of day and each other.
        const topics = [];
        for (const o of worldObjects) {
            if (npc.distTo(o.x, o.y) > 80) continue;
            if (CHAT_LINES[o.type]) { topics.push(o.type, o.type); break; }
        }
        if (CHAT_LINES[currentWeather]) topics.push(currentWeather);
        if (gameHour >= 5 && gameHour < 9)        topics.push('morning');
        else if (gameHour >= 11 && gameHour < 14)  topics.push('noon');
        else if (gameHour >= 18 && gameHour < 21)  topics.push('evening');
        else if (gameHour >= 21 || gameHour < 5)   topics.push('late');
        if (partner) {
            const rel = npc.relationships[partner.name] || 0;
            if (rel >= 60) topics.push('friend', 'friend');
            else if (rel >= 30) topics.push('warm');
        }
        if (topics.length && Math.random() < 0.85) {
            const topic = randEl(topics);
            const sent = pickLine(CHAT_LINES[topic], 'chat_' + topic, { polite: false });
            if (sent) return sent.kanjiText;
        }
        // Short natural fillers
        return randEl(['いいね！','うん。','そうだね。','ははは！','そう！','すごい！','いいよ。','行こう。']);
    }

    // Get routine target based on time of day and NPC affinities
    function getRoutineTarget(npc) {
        let targetType;
        if (gameHour >= 5 && gameHour < 11)       targetType = npc.affinities[0];
        else if (gameHour >= 11 && gameHour < 17)  targetType = npc.affinities[1] || 'market';
        else if (gameHour >= 17 && gameHour < 21)  targetType = 'teahouse';
        else                                        targetType = 'house';
        const obj = worldObjects.find(o => o.type === targetType);
        if (!obj) return null;
        return standSpot(obj);
    }

    // Mood calculation
    function getMood(person) {
        // Sleeping
        if (person.state === 'acting' && person.currentAction &&
            (person.currentAction.id === 'sleep_house' || person.currentAction.id === 'sleep_self')) return null;
        // Night + low energy → tired
        if ((gameHour >= 22 || gameHour < 5) && (!person.energy || person.energy < 30)) return 'tired';
        // Cold weather
        if ((currentWeather === 'snow' || currentWeather === 'wind') && getSeason() === 'winter') return 'cold';
        // Chatting with high-rel partner → happy
        if (person.state === 'chatting' && person.chatPartner) {
            const rel = person.relationships[person.chatPartner.name] || 0;
            if (rel >= 40) return 'happy';
        }
        // Near a friend → happy
        const allChars = [...persons, ...npcs];
        for (const c of allChars) {
            if (c === person) continue;
            if ((person.relationships[c.name] || 0) >= 60 && person.distTo(c.x, c.y) < 60) return 'happy';
        }
        // Near micro event → surprised
        if (activeMicroEvent) {
            const ev = activeMicroEvent;
            const evX = ev.npc ? ev.npc.x : (ev.cat ? ev.cat.x : 0);
            const evY = ev.npc ? ev.npc.y : (ev.cat ? ev.cat.y : 0);
            if (person.distTo(evX, evY) < 80 && person !== ev.npc) return 'surprised';
        }
        // Default — content when weather is nice
        if (currentWeather === 'clear' && gameHour >= 6 && gameHour < 20) return 'content';
        return null;
    }

    // Alert nearby NPCs to look at an event
    function alertNearbyNPCs(x, y, radius, duration) {
        for (const npc of npcs) {
            if (npc.distTo(x, y) < radius && npc.state !== 'chatting') {
                npc.watchTarget = { x, y };
                npc.watchTimer = duration;
                npc.facing = Math.atan2(y - npc.y, x - npc.x);
            }
        }
    }

    let activeNpcInteraction = null;
    let npcInteractionTimer = randFloat(500, 1000);


    function updateNPCs(dt) {
        for (const npc of npcs) {
            // Update watching timer
            if (npc.watchTimer > 0) {
                npc.watchTimer -= dt;
                if (npc.watchTarget) npc.facing = Math.atan2(npc.watchTarget.y - npc.y, npc.watchTarget.x - npc.x);
                if (npc.watchTimer <= 0) { npc.watchTarget = null; }
            }

            // Update mood periodically
            if (_due.mood) npc.mood = getMood(npc);

            switch (npc.state) {
                case 'idle':
                    npc.idleTimer -= dt;
                    npc.activityDe = 'Untätig';

                    // Glance toward high-rel character nearby (~0.1% per tick)
                    if (Math.random() < 0.001 * dt) {
                        const allChars = [...persons, ...npcs];
                        for (const c of allChars) {
                            if (c === npc) continue;
                            if ((npc.relationships[c.name] || 0) >= 30 && npc.distTo(c.x, c.y) < 100) {
                                npc.facing = Math.atan2(c.y - npc.y, c.x - npc.x);
                                break;
                            }
                        }
                    }

                    if (npc.idleTimer <= 0) {
                        // Decide: wander or try to chat
                        const chatChance = 0.35;
                        let startedChat = false;

                        if (Math.random() < chatChance) {
                            // Find another NPC nearby to chat with (weighted by relationship)
                            const candidates = npcs.filter(other =>
                                other !== npc &&
                                other.state === 'idle' &&
                                npc.distTo(other.x, other.y) < 120
                            );
                            let partner = null;
                            if (candidates.length > 0) {
                                const weights = candidates.map(c => 1 + (npc.relationships[c.name] || 0) * 0.05);
                                const total = weights.reduce((s, w) => s + w, 0);
                                let r = Math.random() * total;
                                for (let ci = 0; ci < candidates.length; ci++) {
                                    r -= weights[ci];
                                    if (r <= 0) { partner = candidates[ci]; break; }
                                }
                                if (!partner) partner = candidates[candidates.length - 1];
                            }
                            if (partner) {
                                npc.state = 'chatting';
                                npc.chatTimer = randFloat(80, 200);
                                npc.chatPartner = partner;
                                partner.state = 'chatting';
                                partner.chatTimer = npc.chatTimer;
                                partner.chatPartner = npc;
                                npc.activityDe = 'Redet';
                                partner.activityDe = 'Redet';

                                // Face each other
                                npc.facing = Math.atan2(partner.y - npc.y, partner.x - npc.x);
                                partner.facing = Math.atan2(npc.y - partner.y, npc.x - partner.x);

                                // First bubble — contextual
                                const text = npcContextualChatter(npc, partner);
                                npcBubbles.push(new SpeechBubble(npc, text, [], false));
                                // Boost relationship
                                const oldRel = npc.relationships[partner.name] || 0;
                                npc.relationships[partner.name] = Math.min(100, oldRel + 3);
                                partner.relationships[npc.name] = Math.min(100, (partner.relationships[npc.name] || 0) + 3);
                                startedChat = true;
                            }
                        }

                        if (!startedChat) {
                            // 40% chance: routine target, 60%: random wander
                            if (Math.random() < 0.4 && npc.affinities) {
                                const target = getRoutineTarget(npc);
                                if (target) {
                                    npc.state = 'moving';
                                    setTargetWithPath(npc, Math.max(40, Math.min(WORLD_W - 40, target.x)), Math.max(40, Math.min(WORLD_H - 40, target.y)));
                                    npc.activityDe = 'Geht zum Ziel';
                                } else {
                                    npc.state = 'moving';
                                    setTargetWithPath(npc, Math.max(40, Math.min(WORLD_W - 40, npc.x + randFloat(-120, 120))), Math.max(40, Math.min(WORLD_H - 40, npc.y + randFloat(-120, 120))));
                                    npc.activityDe = 'Geht umher';
                                }
                            } else {
                                npc.state = 'moving';
                                setTargetWithPath(npc, Math.max(40, Math.min(WORLD_W - 40, npc.x + randFloat(-120, 120))), Math.max(40, Math.min(WORLD_H - 40, npc.y + randFloat(-120, 120))));
                                npc.activityDe = 'Geht umher';
                            }
                        }
                    }
                    break;

                case 'moving':
                    if (npc.moveToward(npc.targetX, npc.targetY, dt)) {
                        npc.state = 'idle';
                        npc.idleTimer = randFloat(80, 400);
                    }
                    break;

                case 'chatting':
                    npc.chatTimer -= dt;
                    // Alternating contextual bubbles while chatting
                    if (Math.random() < 0.003 * dt) {
                        // Alternate: sometimes the partner responds instead
                        const speaker = (npc.chatPartner && Math.random() < 0.5) ? npc.chatPartner : npc;
                        const listener = speaker === npc ? npc.chatPartner : npc;
                        const text = npcContextualChatter(speaker, listener);
                        npcBubbles.push(new SpeechBubble(speaker, text, [], false));
                    }
                    if (npc.chatTimer <= 0) {
                        npc.state = 'idle';
                        npc.idleTimer = randFloat(100, 350);
                        npc.chatPartner = null;
                        // Wander away after chat
                        if (Math.random() < 0.5) {
                            npc.state = 'moving';
                            setTargetWithPath(npc, Math.max(40, Math.min(WORLD_W - 40, npc.x + randFloat(-100, 100))), Math.max(40, Math.min(WORLD_H - 40, npc.y + randFloat(-100, 100))));
                        }
                    }
                    break;
            }
        }

        // Update NPC bubbles
        npcBubbles = npcBubbles.filter(b => b.update(dt));
    }

    function boostRelationshipsNearby(actor, amount) {
