<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nihongo Mura">
    <title>Nihongo Mura — Japanisch-Sprachsimulation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        :root {
            /* Woodblock / washi palette — mirrored by PALETTE in the script */
            --sumi: #2b2622;
            --washi: #f3ead8;
            --washi-deep: #e6d8bb;
            --ai: #2e4a6b;
            --ai-deep: #1f3550;
            --ai-light: #6f93b5;
            --shu: #c8442f;
            --kin: #c99a3a;
            --matsu: #3f5a3a;
            /* UI surfaces: warm ink, from page to raised */
            --ink-0: #13110e;
            --ink-1: #1b1814;
            --ink-2: #231f1a;
            --ink-3: #2e2922;
            --ink-4: #3a332a;
            --line: rgba(243,234,216,0.08);
            --line-strong: rgba(243,234,216,0.16);
            --text: #ece2cb;
            --text-dim: #ad9f86;
            --text-faint: #786d5c;
            --good: #86ab6f;
            --warn: #cfa84f;
            --bad: #c9694f;
            --radius: 10px;
            /* Type — mincho for kanji & headings, rounded gothic for UI */
            --font-mincho: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
            --font-ui: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: var(--ink-0);
            color: var(--text);
            font-family: var(--font-ui);
            font-size: 14px;
            line-height: 1.4;
            overflow: hidden;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        button { font: inherit; color: inherit; }
        svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        :focus { outline: none; }
        :focus-visible { outline: 2px solid var(--kin); outline-offset: 2px; border-radius: 8px; }

        /* ---------- Header ---------- */
        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 14px;
            min-height: 54px;
            flex-shrink: 0;
            background: linear-gradient(180deg, var(--ink-2), var(--ink-1));
            border-bottom: 1px solid var(--line);
        }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .brand-seal {
            width: 34px; height: 34px;
            display: grid; place-items: center;
            border-radius: 7px;
            background: var(--shu);
            color: #fbefe0;
            font-family: var(--font-mincho);
            font-weight: 800;
            font-size: 20px;
            box-shadow: inset 0 0 0 2px rgba(251,239,224,0.25), 0 2px 6px rgba(0,0,0,0.35);
            transform: rotate(-3deg);
            flex-shrink: 0;
        }
        .brand-text { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
        .brand-jp { font-family: var(--font-mincho); font-weight: 700; font-size: 17px; letter-spacing: 0.08em; color: var(--washi); white-space: nowrap; }
        .brand-en { font-size: 11px; color: var(--text-dim); letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; }
        #controls { display: flex; align-items: center; gap: 6px; }
        .seg {
            display: flex;
            padding: 3px;
            gap: 2px;
            background: var(--ink-0);
            border: 1px solid var(--line);
            border-radius: 10px;
        }
        .seg button, .icon-btn {
            min-width: 40px; height: 36px;
            padding: 0 10px;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: transparent;
            border: none;
            border-radius: 7px;
            color: var(--text-dim);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s, color 0.15s;
        }
        .seg button:hover, .icon-btn:hover { background: var(--ink-3); color: var(--text); }
        .seg button.active { background: var(--ink-4); color: var(--washi); box-shadow: inset 0 -2px 0 var(--kin); }
        .icon-btn { border: 1px solid var(--line); background: var(--ink-2); padding: 0; width: 40px; }
        #btn-sound .snd-off { display: none; }
        #btn-sound.off .snd-on { display: none; }
        #btn-sound.off .snd-off { display: inline; }
        #btn-sound.off { color: var(--text-faint); }
        #btn-save.saved { color: var(--good); border-color: rgba(134,171,111,0.6); }

        /* ---------- Command bar ---------- */
        #command-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: var(--ink-1);
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
        }
        #command-label {
            font-family: var(--font-mincho);
            font-weight: 700;
            font-size: 13px;
            color: #fbefe0;
            background: var(--ai);
            padding: 5px 8px;
            border-radius: 6px;
            letter-spacing: 0.1em;
            flex-shrink: 0;
        }
        .cmd-field {
            flex: 1;
            display: flex;
            align-items: center;
            min-width: 0;
            background: var(--ink-0);
            border: 1px solid var(--line-strong);
            border-radius: 10px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .cmd-field:focus-within { border-color: var(--kin); box-shadow: 0 0 0 3px rgba(201,154,58,0.18); }
        #command-input {
            flex: 1;
            min-width: 0;
            padding: 9px 12px;
            background: transparent;
            border: none;
            color: var(--text);
            font: inherit;
            font-size: 14px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }
        #command-input::placeholder, #vocab-search::placeholder { color: var(--text-faint); }
        #command-send {
            width: 36px; height: 32px;
            margin-right: 3px;
            display: grid; place-items: center;
            background: var(--kin);
            color: var(--ink-0);
            border: none;
            border-radius: 7px;
            cursor: pointer;
            flex-shrink: 0;
        }
        #command-send:hover { filter: brightness(1.08); }
        #command-feedback {
            display: none;
            padding: 6px 14px;
            font-size: 12.5px;
            color: var(--text-dim);
            background: var(--ink-1);
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
        }
        #command-feedback.visible { display: block; }

        /* ---------- World ---------- */
        #main { display: flex; flex: 1; min-height: 0; overflow: hidden; }
        #canvas-wrap { flex: 1; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--ink-0); }
        /* Print-style darkened margins; a CSS layer so the compositor draws it, not the canvas */
        #canvas-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(40,26,12,0) 58%, rgba(40,26,12,0.10) 80%, rgba(40,26,12,0.26) 100%);
        }
        #gameCanvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
        #gameCanvas.pannable { cursor: grab; }
        #gameCanvas.dragging { cursor: grabbing; }
        .time-chip {
            position: absolute;
            top: 12px; left: 12px;
            z-index: 2;
            display: flex; align-items: center; gap: 8px;
            padding: 6px 12px 6px 9px;
            background: rgba(27,24,20,0.72);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            color: var(--text);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            pointer-events: none;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        }
        .time-chip b { font-weight: 700; color: var(--washi); }
        .time-chip .tc-meta { color: var(--text-dim); font-size: 12px; padding-left: 8px; border-left: 1px solid var(--line-strong); }
        .time-chip svg.i { width: 17px; height: 17px; }
        .time-chip[data-phase="sun"] svg { color: #f0c463; }
        .time-chip[data-phase="dawn"] svg, .time-chip[data-phase="dusk"] svg { color: #f09a6a; }
        .time-chip[data-phase="moon"] svg { color: #c9d3f0; }

        /* ---------- Panel ---------- */
        #panel {
            width: 340px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            background: var(--ink-1);
            border-left: 1px solid var(--line);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--ink-4) transparent;
        }
        #panel::-webkit-scrollbar, #panel ::-webkit-scrollbar { width: 6px; }
        #panel::-webkit-scrollbar-thumb, #panel ::-webkit-scrollbar-thumb { background: var(--ink-4); border-radius: 3px; }
        #panel::-webkit-scrollbar-track, #panel ::-webkit-scrollbar-track { background: transparent; }
        .sheet-bar { display: none; }
        .card {
            background: var(--ink-2);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 12px;
            flex-shrink: 0;
        }
        .card-title {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 10px;
            font-family: var(--font-mincho);
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.06em;
            color: var(--washi);
        }
        .seal-stamp {
            display: inline-grid; place-items: center;
            width: 20px; height: 20px;
            border: 1.5px solid var(--shu);
            border-radius: 5px;
            color: var(--shu);
            font-family: var(--font-mincho);
            font-weight: 800;
            font-size: 12px;
            line-height: 1;
            transform: rotate(-4deg);
            opacity: 0.9;
        }

        /* Character cards */
        .char-header { display: flex; align-items: center; gap: 11px; margin-bottom: 11px; }
        .char-portrait {
            width: 42px; height: 42px;
            display: grid; place-items: center;
            border-radius: 50%;
            font-family: var(--font-mincho);
            font-weight: 800;
            font-size: 21px;
            color: #fbefe0;
            box-shadow: inset 0 0 0 2px rgba(251,239,224,0.22);
            flex-shrink: 0;
        }
        .char-portrait.role-speaker { background: var(--ai); }
        .char-portrait.role-learner { background: #a83a28; }
        .char-id { min-width: 0; flex: 1; }
        .char-name { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 15px; color: var(--washi); }
        .char-role { font-size: 12px; color: var(--text-dim); }
        .stat-row { display: grid; grid-template-columns: 82px 1fr 18px; align-items: center; gap: 8px; margin: 4px 0; }
        .stat-label { font-size: 12.5px; color: var(--text-dim); }
        .pips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
        .pips i { height: 7px; border-radius: 2px; background: var(--ink-4); }
        .pips.hi i.on { background: var(--good); }
        .pips.mid i.on { background: var(--warn); }
        .pips.lo i.on { background: var(--bad); }
        .stat-val { font-size: 12px; color: var(--text-dim); text-align: right; font-variant-numeric: tabular-nums; }
        .needs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .need { display: flex; align-items: center; gap: 7px; min-width: 0; }
        .need-k {
            width: 22px; height: 22px;
            display: grid; place-items: center;
            border-radius: 6px;
            background: var(--ink-3);
            font-family: var(--font-mincho);
            font-weight: 700;
            font-size: 12.5px;
            color: var(--washi-deep);
            flex-shrink: 0;
        }
        .need-bar { flex: 1; height: 5px; border-radius: 3px; background: var(--ink-4); overflow: hidden; }
        .need-bar > i { display: block; height: 100%; border-radius: 3px; transition: width 0.5s; }
        .activity {
            display: flex; align-items: center; gap: 6px;
            margin-top: 11px;
            padding: 6px 10px;
            border-radius: 7px;
            background: var(--ink-3);
            font-size: 12.5px;
            color: var(--text);
        }
        .activity::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--kin); flex-shrink: 0; }

        /* Vocabulary */
        .progress-text { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
        .progress-text b { color: var(--washi); font-weight: 700; }
        .progress-bar-bg { height: 6px; border-radius: 3px; background: var(--ink-4); overflow: hidden; }
        .progress-bar { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #5f8a4f, var(--good)); transition: width 0.5s; }
        #vocab-search {
            width: 100%;
            margin: 10px 0 6px;
            padding: 8px 11px;
            background: var(--ink-0);
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            color: var(--text);
            font: inherit;
            font-size: 13px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }
        #vocab-search:focus { border-color: var(--kin); box-shadow: 0 0 0 3px rgba(201,154,58,0.16); }
        .vocab-list { max-height: 236px; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
        .vocab-word {
            display: grid;
            grid-template-columns: minmax(44px, auto) 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 5px 6px;
            border-radius: 7px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .vocab-word:hover { background: var(--ink-3); }
        .vocab-word + .vocab-word { border-top: 1px solid var(--line); }
        .vw-kanji { font-family: var(--font-mincho); font-weight: 700; font-size: 21px; color: var(--washi); line-height: 1.2; white-space: nowrap; }
        .vw-reading { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .vw-meaning { font-size: 13px; color: var(--good); text-align: right; }
        .vocab-word.new { animation: flashNew 1.2s; }
        @keyframes flashNew { from { background: rgba(134,171,111,0.28); } to { background: transparent; } }
        .empty { padding: 10px 6px; font-size: 12.5px; color: var(--text-faint); }

        /* Event log */
        .log-card { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 180px; }
        #event-log { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
        .log-entry { display: flex; gap: 9px; padding: 5px 4px; font-size: 12.5px; color: var(--text-dim); border-top: 1px solid var(--line); }
        .log-entry:first-child { border-top: none; }
        .log-entry .log-time { color: var(--text-faint); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 11.5px; padding-top: 1px; }
        .log-entry.learn { color: var(--good); }
        .log-entry.speak { color: var(--text); }

        #panel-toggle { display: none; }
        #perf-hud {
            position: absolute; left: 12px; bottom: 12px; z-index: 3;
            padding: 6px 10px; border-radius: 8px;
            background: rgba(19,17,14,0.82); border: 1px solid var(--line-strong);
            color: var(--text); font: 500 11.5px/1.45 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            white-space: pre; pointer-events: none;
        }

        /* ---------- Narrow / portrait: map full screen, panel as a bottom sheet ---------- */
        @media (max-width: 800px), (orientation: portrait) {
            #panel {
                position: fixed;
                left: 0; right: 0; bottom: 0;
                width: auto;
                height: min(64dvh, 600px);
                z-index: 40;
                padding: 0 10px calc(10px + env(safe-area-inset-bottom));
                border-left: none;
                border-top: 1px solid var(--line-strong);
                border-radius: 18px 18px 0 0;
                box-shadow: 0 -12px 32px rgba(0,0,0,0.45);
                transform: translateY(105%);
                transition: transform 0.28s cubic-bezier(.2,.8,.2,1);
                visibility: hidden;
            }
            #panel.open { transform: none; visibility: visible; }
            .sheet-bar {
                display: flex; align-items: center; justify-content: space-between;
                position: sticky; top: 0; z-index: 1;
                margin: 0 -10px;
                padding: 8px 14px 6px;
                background: var(--ink-1);
                border: none;
                color: var(--text-dim);
                cursor: pointer;
                font-size: 12.5px;
            }
            .sheet-bar::before { content: ''; position: absolute; left: 50%; top: 6px; width: 38px; height: 4px; margin-left: -19px; border-radius: 2px; background: var(--ink-4); }
            .sheet-bar span { padding-top: 8px; }
            #panel-toggle {
                display: grid; place-items: center;
                position: fixed;
                right: calc(16px + env(safe-area-inset-right));
                bottom: calc(16px + env(safe-area-inset-bottom));
                width: 52px; height: 52px;
                z-index: 30;
                border-radius: 50%;
                background: var(--shu);
                color: #fbefe0;
                border: none;
                box-shadow: 0 6px 18px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(251,239,224,0.22);
                cursor: pointer;
                touch-action: manipulation;
                -webkit-tap-highlight-color: transparent;
                transition: transform 0.2s, opacity 0.2s;
            }
            #panel-toggle svg.i { width: 22px; height: 22px; }
            #panel-toggle[aria-expanded="true"] { transform: scale(0.6); opacity: 0; pointer-events: none; }
        }
        @media (max-width: 560px) {
            #header { padding: 6px 10px; min-height: 48px; gap: 8px; }
            .brand-en { display: none; }
            .brand-jp { font-size: 15px; }
            .brand-seal { width: 30px; height: 30px; font-size: 17px; }
            #controls { gap: 4px; }
            .seg { padding: 2px; }
            .seg button { min-width: 32px; height: 32px; padding: 0 6px; font-size: 13px; }
            .icon-btn { width: 34px; min-width: 34px; height: 34px; }
            #command-bar { padding: 7px 10px; gap: 8px; }
            .time-chip { top: 8px; left: 8px; font-size: 12px; padding: 5px 10px 5px 8px; }
            .time-chip .tc-meta { font-size: 11px; }
        }
        @media (max-width: 380px) {
            .brand-text { display: none; }
            .time-chip .tc-meta { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
        }
        </style>
</head>
<body>
    <header id="header">
        <div class="brand">
            <span class="brand-seal" aria-hidden="true">村</span>
            <div class="brand-text">
                <span class="brand-jp">日本語村</span>
                <span class="brand-en">Nihongo Mura · Sprachsimulation</span>
            </div>
        </div>
        <div id="controls">
            <div class="seg" id="speed-group" role="group" aria-label="Geschwindigkeit">
                <button id="btn-pause" onclick="setSpeed(0)" aria-label="Pause" title="Pause (Leertaste)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3.5" height="14" rx="1"/><rect x="13.5" y="5" width="3.5" height="14" rx="1"/></svg></button>
                <button id="btn-1x" class="active" onclick="setSpeed(1)" aria-label="Normalgeschwindigkeit" title="1× (Taste 1)">1×</button>
                <button id="btn-2x" onclick="setSpeed(2)" aria-label="Doppelte Geschwindigkeit" title="2× (Taste 2)">2×</button>
                <button id="btn-3x" onclick="setSpeed(3)" aria-label="Dreifache Geschwindigkeit" title="3× (Taste 3)">3×</button>
            </div>
            <button class="icon-btn" id="btn-sound" onclick="toggleSound()" aria-label="Ton an/aus" aria-pressed="true" title="Ton (M)"><svg class="i snd-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18.2 6.5a8 8 0 0 1 0 11"/></svg><svg class="i snd-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
            <button class="icon-btn" id="btn-save" onclick="manualSave()" aria-label="Speichern" title="Speichern"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h9.5L19 7.5V19a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8.5 4v4.5h6V4"/><rect x="8" y="13" width="8" height="5" rx="0.8"/></svg></button>
            <button class="icon-btn" id="btn-new" onclick="newGame()" aria-label="Neues Spiel" title="Neues Spiel"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg></button>
        </div>
    </header>
    <div id="command-bar">
        <label id="command-label" for="command-input">命令</label>
        <div class="cmd-field">
            <input type="text" id="command-input" placeholder="Befehl an den Lernenden (Romaji / Kana) …" autocomplete="off" autocapitalize="off" spellcheck="false">

    <script>
    // ---- Web fonts: one small subset file per weight, containing only the glyphs this page uses
    // (built from the page's own text, so edits stay covered); added without blocking first paint.
    (function loadWebFonts() {
        try {
            const src = (document.currentScript ? document.currentScript.text : '') + document.body.textContent;
            const set = new Set(src.match(/[\u3000-\u30ff\u4e00-\u9fff\uff00-\uffef]/g) || []);
            for (let c = 0x3041; c <= 0x3096; c++) set.add(String.fromCharCode(c));   // every kana: conjugation can produce any
            for (let c = 0x30a1; c <= 0x30fa; c++) set.add(String.fromCharCode(c));
            set.add('ー');
            let latin = '';
            for (let c = 32; c < 127; c++) latin += String.fromCharCode(c);
            const text = [...set].sort().join('') + latin + 'äöüÄÖÜß„“”‘’–—…·×→';
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap&text=' + encodeURIComponent(text);
            document.head.appendChild(link);
        } catch (e) { /* fonts are decorative; system fallbacks apply */ }
    })();

    // ============================================================
    //  CONFIGURATION
    // ============================================================
    const WORLD_W = 1000;
    const WORLD_H = 640;
    const HEARING_RANGE = 180; // base reference; actual range is per-learner via wahrnehmung
    const TICK_MS = 16;
    const SPEAKER_NAMES = ["明","花","健","美","太郎","桜","翔","葵","蓮","凛","陸","結","悠","愛","大","智"];
    const LEARNER_NAMES = ["Hans","Lena","Fritz","Greta","Karl","Anna","Otto","Helga","Klaus","Ingrid","Max","Elsa"];
    const NPC_NAMES = ["誠","真","優","和","幸","信","義","勇","恵","雅","光","清","福","寿","康","宝"];

    // ============================================================
    //  AUDIO ENGINE (Web Audio API — procedural Japanese soundtrack)
    //  Instruments: shakuhachi (尺八), koto (琴), shamisen (三味線),
    //  Japanese percussion (太鼓 taiko, 鈴 suzu, 鉦 kane, 木魚 mokugyo)
    // ============================================================
    let audioCtx = null;
    let audioMaster = null;
    let soundEnabled = true;
    let audioStarted = false;
    let musicPlaying = false;
    let musicGeneration = 0;
    let musicNodes = [];

    function ensureAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioMaster = audioCtx.createGain();
        audioMaster.gain.value = 0.5;
        audioMaster.connect(audioCtx.destination);
    }

    function resumeAudio() {
        if (!audioCtx) ensureAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioStarted) {
            audioStarted = true;
            startJapaneseMusic();
        }
    }

    // Start audio on first user interaction (autoplay policy)
    ['click','touchstart','keydown'].forEach(evt => {
        document.addEventListener(evt, resumeAudio, { once: true, passive: true });
    });

    function toggleSound() {
        soundEnabled = !soundEnabled;
        const btn = document.getElementById('btn-sound');
        btn.classList.toggle('off', !soundEnabled);
        btn.setAttribute('aria-pressed', String(soundEnabled));
        if (soundEnabled) {
            resumeAudio();
            if (audioStarted && !musicPlaying) startJapaneseMusic();
        } else {
            stopJapaneseMusic();
        }
    }

    function stopJapaneseMusic() {
        if (!musicPlaying) return;
        musicPlaying = false;
        musicGeneration++;
        stopSeasonalAmbient();
        for (const node of musicNodes) {
            try {
                if (node.stop) node.stop();
            } catch (_) { /* already stopped */ }
            try {
                node.disconnect();
            } catch (_) {}
        }
        musicNodes = [];
        // Reset references so startJapaneseMusic can recreate them
        musicGainNode = null;
        droneOsc1 = null; droneOsc2 = null; droneFilt = null; droneGainNode = null; droneLfo = null;
        ambNoiseNode = null; ambFiltNode = null; ambGainNode = null; ambLfo = null; ambLfoGain = null;
        shakuhachiGainNode = null;
        kotoGainNode = null;
        shamisenGainNode = null;
    }

    // --- Utility: create noise buffer (cached by duration) ---
    const _noiseBufferCache = {};
    function createNoiseBuffer(duration) {
        // Round to nearest 0.01s to maximize cache hits
        const key = Math.round(duration * 100);
        if (_noiseBufferCache[key]) return _noiseBufferCache[key];
        const len = audioCtx.sampleRate * duration;
        const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        _noiseBufferCache[key] = buf;
        return buf;
    }

    // --- ADAPTIVE MOOD-BASED JAPANESE MUSIC ENGINE ---
    // Detects time-of-day + weather and smoothly transitions between musical moods
    // Uses authentic Japanese scales and instrument simulations:
    //   尺八 shakuhachi, 琴 koto, 三味線 shamisen

    // Japanese scale definitions:
    // In scale (陰音階 miyako-bushi): semitones 0,1,5,7,8 — e.g. C Db F G Ab
    // Yo scale (陽音階): semitones 0,2,5,7,10 — e.g. C D F G Bb
    // Hirajoshi scale: semitones 0,2,3,7,8 — e.g. C D Eb G Ab

    // Helper: build scale from root frequency and semitone pattern across 2 octaves
    function buildJapaneseScale(rootFreq, semitones) {
        const notes = [];
        for (let octave = 0; octave < 2; octave++) {
            for (const s of semitones) {
                notes.push(rootFreq * Math.pow(2, (s + octave * 12) / 12));
            }
        }
        return notes;
    }

    // Pre-built scales for each mood
    const IN_SCALE_C4    = buildJapaneseScale(261.6, [0, 1, 5, 7, 8]);   // C4 root
    const IN_SCALE_A3    = buildJapaneseScale(220,   [0, 1, 5, 7, 8]);   // A3 root (low register)
    const IN_SCALE_E4    = buildJapaneseScale(329.6, [0, 1, 5, 7, 8]);   // E4 root (higher register)
    const YO_SCALE_C4    = buildJapaneseScale(261.6, [0, 2, 5, 7, 10]);  // C4 root
    const YO_SCALE_G3    = buildJapaneseScale(196,   [0, 2, 5, 7, 10]);  // G3 root (low register)
    const HIRAJOSHI_C4   = buildJapaneseScale(261.6, [0, 2, 3, 7, 8]);   // C4 root
    const HIRAJOSHI_C5   = buildJapaneseScale(523.3, [0, 2, 3, 7, 8]);   // C5 root (high crystalline)

    // Mood definitions: each mood configures all music layers
    const MUSIC_MOODS = {
        day: {
            bpm: 52, droneFreq: 65.4, droneDetune: 0.15, droneVol: 0.06, droneFilter: 200,
            // Yo scale (陽音階) — bright, positive, lively village
            scale: YO_SCALE_C4,
            shakuhachiVol: 0.22, shakuhachiInterval: [5, 10], noteDur: [0.3, 1.2], noteCount: [3, 6],
            kotoVol: 0.18, kotoInterval: [3, 7], kotoNotes: [3, 6],
            shamisenVol: 0.0, shamisenInterval: [20, 40], shamisenDur: [0, 0],
            percVol: 0.20, percPattern: 'village', hyoushigiVol: 0.08,
            ambVol: 0.04, ambFreq: 400, ambQ: 0.3, ambLfoRate: 0.10, ambLfoDepth: 0.02,
        },
        dawn: {
            bpm: 40, droneFreq: 82.4, droneDetune: 0.1, droneVol: 0.05, droneFilter: 160,
            // In scale (陰音階) higher register — serene morning
            scale: IN_SCALE_E4,
            shakuhachiVol: 0.26, shakuhachiInterval: [8, 16], noteDur: [0.8, 2.0], noteCount: [2, 4],
            kotoVol: 0.14, kotoInterval: [6, 14], kotoNotes: [2, 4],
            shamisenVol: 0.0, shamisenInterval: [30, 50], shamisenDur: [0, 0],
            percVol: 0.0, percPattern: 'none', hyoushigiVol: 0.0,
            ambVol: 0.06, ambFreq: 500, ambQ: 0.2, ambLfoRate: 0.05, ambLfoDepth: 0.02,
        },
        dusk: {
            bpm: 44, droneFreq: 55, droneDetune: 0.25, droneVol: 0.08, droneFilter: 140,
            // Hirajoshi scale — melancholic evening
            scale: HIRAJOSHI_C4,
            shakuhachiVol: 0.20, shakuhachiInterval: [7, 15], noteDur: [0.8, 2.0], noteCount: [2, 4],
            kotoVol: 0.16, kotoInterval: [5, 10], kotoNotes: [2, 5],
            shamisenVol: 0.16, shamisenInterval: [10, 20], shamisenDur: [2.0, 4.5],
            percVol: 0.08, percPattern: 'temple', hyoushigiVol: 0.0,
            ambVol: 0.05, ambFreq: 300, ambQ: 0.4, ambLfoRate: 0.07, ambLfoDepth: 0.02,
        },
        night: {
            bpm: 32, droneFreq: 55, droneDetune: 0.15, droneVol: 0.08, droneFilter: 100,
            // Sparse In scale low register — contemplative night
            scale: IN_SCALE_A3,
            shakuhachiVol: 0.0, shakuhachiInterval: [20, 40], noteDur: [1.5, 3.0], noteCount: [1, 2],
            kotoVol: 0.12, kotoInterval: [8, 18], kotoNotes: [1, 3],
            shamisenVol: 0.14, shamisenInterval: [12, 25], shamisenDur: [3.0, 6.0],
            percVol: 0.0, percPattern: 'none', hyoushigiVol: 0.0,
            ambVol: 0.05, ambFreq: 200, ambQ: 0.5, ambLfoRate: 0.03, ambLfoDepth: 0.03,
        },
        rain: {
            bpm: 46, droneFreq: 61.7, droneDetune: 0.35, droneVol: 0.07, droneFilter: 130,
            // In scale (陰音階) — wistful rain
            scale: IN_SCALE_C4,
            shakuhachiVol: 0.16, shakuhachiInterval: [8, 18], noteDur: [0.6, 1.8], noteCount: [2, 4],
            kotoVol: 0.20, kotoInterval: [4, 8], kotoNotes: [3, 6],
            shamisenVol: 0.12, shamisenInterval: [14, 28], shamisenDur: [2.0, 4.0],
            percVol: 0.06, percPattern: 'rain', hyoushigiVol: 0.12,

        snow: {

            scale: HIRAJOSHI_C5,

            kotoVol: 0.16, kotoInterval: [10, 22], kotoNotes: [1, 3],

            percVol: 0.0, percPattern: 'none', hyoushigiVol: 0.0,
