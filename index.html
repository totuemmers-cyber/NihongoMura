<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nihongo Mura">
    <title>Nihongo Mura — Japanisch-Sprachsimulation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="header">
        <div class="brand">
            <span class="brand-seal" aria-hidden="true">村</span>
            <div class="brand-text">
                <span class="brand-jp">日本語村</span>
                <span class="brand-en">Nihongo Mura · Sprachsimulation</span>
            </div>
        </div>
        <div id="controls">
            <div class="seg" id="speed-group" role="group" aria-label="Geschwindigkeit">
                <button id="btn-pause" onclick="setSpeed(0)" aria-label="Pause" title="Pause (Leertaste)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3.5" height="14" rx="1"/><rect x="13.5" y="5" width="3.5" height="14" rx="1"/></svg></button>
                <button id="btn-1x" class="active" onclick="setSpeed(1)" aria-label="Normalgeschwindigkeit" title="1× (Taste 1)">1×</button>
                <button id="btn-2x" onclick="setSpeed(2)" aria-label="Doppelte Geschwindigkeit" title="2× (Taste 2)">2×</button>
                <button id="btn-3x" onclick="setSpeed(3)" aria-label="Dreifache Geschwindigkeit" title="3× (Taste 3)">3×</button>
            </div>
            <button class="icon-btn" id="btn-sound" onclick="toggleSound()" aria-label="Ton an/aus" aria-pressed="true" title="Ton (M)"><svg class="i snd-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18.2 6.5a8 8 0 0 1 0 11"/></svg><svg class="i snd-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
            <button class="icon-btn" id="btn-save" onclick="manualSave()" aria-label="Speichern" title="Speichern"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h9.5L19 7.5V19a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8.5 4v4.5h6V4"/><rect x="8" y="13" width="8" height="5" rx="0.8"/></svg></button>
            <button class="icon-btn" id="btn-new" onclick="newGame()" aria-label="Neues Spiel" title="Neues Spiel"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg></button>
        </div>
    </header>
    <div id="command-bar">
        <label id="command-label" for="command-input">命令</label>
        <div class="cmd-field">
            <input type="text" id="command-input" placeholder="Befehl an den Lernenden (Romaji / Kana) …" autocomplete="off" autocapitalize="off" spellcheck="false">
            <button id="command-send" onclick="submitCommand()" aria-label="Befehl senden"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13"/><path d="M13 6.5l5.5 5.5-5.5 5.5"/></svg></button>
        </div>
    </div>
    <div id="main">
        <div id="canvas-wrap">
            <canvas id="gameCanvas" role="img" aria-label="Nihongo Mura Spielwelt — japanisches Dorf mit Charakteren"></canvas>
            <div id="time-display" class="time-chip"></div>
        </div>
        <aside id="panel" aria-label="Dorf-Übersicht">
            <button class="sheet-bar" onclick="togglePanel()" aria-label="Übersicht schließen"><span>Übersicht</span><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg></button>
            <section id="char1-panel" class="panel-section card"></section>
            <section id="char2-panel" class="panel-section card"></section>
            <section id="vocab-panel" class="panel-section card">
                <h2 class="card-title"><span>Vokabular</span><span class="seal-stamp">語</span></h2>
                <div class="progress-text" id="vocab-progress">0 / 0 Wörter gelernt</div>
                <div class="progress-bar-bg"><div class="progress-bar" id="vocab-bar" style="width:0%"></div></div>
                <input type="search" id="vocab-search" placeholder="Suche (Romaji / Kana / Deutsch) …" autocomplete="off" autocapitalize="off" spellcheck="false">
                <div class="vocab-list" id="vocab-list"></div>
            </section>
            <section class="panel-section card log-card">
                <h2 class="card-title"><span>Ereignisse</span><span class="seal-stamp">録</span></h2>
                <div id="event-log"></div>
            </section>
        </aside>
    </div>
    <button id="panel-toggle" onclick="togglePanel()" aria-label="Übersicht öffnen" aria-expanded="false" aria-controls="panel"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5c-2-1.6-4.6-2-7.5-1.5v13c2.9-.5 5.5-.1 7.5 1.5 2-1.6 4.6-2 7.5-1.5V5c-2.9-.5-5.5-.1-7.5 1.5z"/><path d="M12 6.5v13"/></svg></button>

    <script src="js/glyphs.js"></script>
    <script src="js/fonts.js"></script>
    <script src="js/config.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/data/vocabulary.js"></script>
    <script src="js/world.js"></script>
    <script src="js/data/actions.js"></script>
    <script src="js/festivals.js"></script>
    <script src="js/state.js"></script>
    <script src="js/language.js"></script>
    <script src="js/overlays.js"></script>
    <script src="js/render.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/villagers.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/events.js"></script>
    <script src="js/interaction.js"></script>
    <script src="js/save.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
